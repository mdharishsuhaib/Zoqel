spring:
  datasource:
    url: jdbc:h2:mem:zoqeldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

zoqel:
  openrouter:
    api-key: ${OPENROUTER_API_KEY:your_api_key_here}
