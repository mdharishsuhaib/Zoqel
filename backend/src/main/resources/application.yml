spring:
  application:
    name: zoqel-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:default_local_secret_key_change_in_production}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

zoqel:
  ollama:
    api-key: ${OLLAMA_API_KEY:}
    base-url: ${OLLAMA_BASE_URL:https://ollama.com/v1}
    model: ${OLLAMA_MODEL:gpt-oss:120b-cloud}
    site-url: https://zoqel.ai
    site-name: Zoqel
  policy:
    max-retries: 1
    min-confidence: 0.75
    max-auto-amount-paise: 1000000
