spring:
  application:
    name: zoqel-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/zoqel_db}
    username: ${DB_USER:zoqel}
    password: ${DB_PASSWORD:zoqel_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

zoqel:
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: https://openrouter.ai/api/v1
    model: ${OPENROUTER_MODEL:openai/gpt-4o}
    site-url: https://zoqel.ai
    site-name: Zoqel
  policy:
    max-retries: 1
    min-confidence: 0.75
    max-auto-amount-paise: 1000000
